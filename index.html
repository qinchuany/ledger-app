<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#4ECDC4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账存钱">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="个人记账存钱工作台 - 短期计划与长期目标管理">
<title>🌿 记账存钱工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============ 全局变量与重置 ============ */
:root{
  /* 主色系 - 柔和现代 */
  --mint:#10B981;
  --mint-light:#34D399;
  --mint-bg:#ECFDF5;
  --mint-50:#F0FDFA;
  --blue:#3B82F6;
  --blue-light:#60A5FA;
  --blue-bg:#EFF6FF;
  --purple:#8B5CF6;
  --purple-bg:#F5F3FF;
  --pink:#EC4899;
  --pink-bg:#FDF2F8;
  --orange:#F59E0B;
  --orange-bg:#FFFBEB;
  /* 文字 */
  --ink:#0F172A;
  --ink-2:#334155;
  --ink-3:#64748B;
  --ink-4:#94A3B8;
  /* 边线 / 背景 */
  --line:#E2E8F0;
  --line-2:#F1F5F9;
  --bg:#F8FAFC;
  --bg-2:#F1F5F9;
  --card:#FFFFFF;
  --glass:rgba(255,255,255,.7);
  /* 状态色 */
  --green:#10B981;
  --green-bg:#ECFDF5;
  --red:#EF4444;
  --red-bg:#FEF2F2;
  --yellow:#F59E0B;
  --yellow-bg:#FFFBEB;
  /* 阴影 - 更柔和有层次 */
  --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.08),0 2px 4px -2px rgba(15,23,42,.04);
  --shadow-hover:0 12px 24px -4px rgba(15,23,42,.12),0 4px 8px -2px rgba(15,23,42,.06);
  --shadow-card:0 1px 3px rgba(15,23,42,.05);
  /* 圆角 */
  --radius:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --radius-xs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:.01em;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);outline:none}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}

/* ============ 布局 ============ */
.app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line-2);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.topbar .app-icon{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--mint),var(--mint-light));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 12px rgba(16,185,129,.3);flex-shrink:0;
}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.topbar .subtitle{color:var(--ink-3);font-size:12px;margin-top:1px;font-weight:500}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.month-switch{display:flex;align-items:center;gap:2px;background:#fff;padding:3px;border-radius:9px;box-shadow:var(--shadow);border:1px solid var(--line)}
.month-switch button{padding:5px 11px;border-radius:6px;color:var(--ink-3);font-size:14px;font-weight:700;transition:all .15s;line-height:1}
.month-switch button:hover{background:var(--bg-2);color:var(--ink)}
.month-switch .label{padding:0 8px;font-weight:700;font-size:12.5px;min-width:84px;text-align:center;color:var(--ink)}

/* 主内容区 */
.main{
  flex:1;
  padding:20px 20px 100px;
  max-width:760px;
  width:100%;
  margin:0 auto;
  min-width:0;
}

/* ============ 底部导航 ============ */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:30;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  max-width:560px;
  margin:0 auto;
  box-shadow:0 -4px 24px rgba(15,23,42,.06);
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:7px 4px;
  border-radius:10px;
  color:var(--ink-4);
  font-size:10px;
  font-weight:600;
  transition:all .18s;
  text-align:center;
  flex:1;
  min-width:0;
  position:relative;
}
.nav-item .icon{
  font-size:20px;
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;
  transition:all .18s;
  margin-bottom:1px;
}
.nav-item .label{font-size:10px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.nav-item:hover{color:var(--ink-3)}
.nav-item:hover .icon{background:var(--bg-2)}
.nav-item.active{color:var(--mint)}
.nav-item.active .icon{
  background:var(--mint-bg);
  transform:translateY(-1px);
}
.nav-item.active::before{
  content:"";
  position:absolute;
  top:2px;
  width:18px;height:3px;
  background:var(--mint);
  border-radius:2px;
}

/* ============ 按钮 ============ */
.btn{
  padding:9px 16px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#fff;
  color:var(--ink-2);
  border:1px solid var(--line);
  white-space:nowrap;
}
.btn:hover{background:var(--bg-2);color:var(--ink);border-color:var(--ink-4)}
.btn-primary{background:var(--mint);color:#fff;border-color:var(--mint);box-shadow:0 2px 6px rgba(16,185,129,.25)}
.btn-primary:hover{background:#059669;color:#fff;border-color:#059669;box-shadow:0 4px 10px rgba(16,185,129,.35)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-blue:hover{background:#2563EB;color:#fff}
.btn-danger{color:var(--red);background:transparent;border-color:transparent}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:6px}
.btn-icon{padding:6px 8px;border-radius:6px}

/* ============ 卡片 ============ */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
  padding:22px;
  border:1px solid var(--line-2);
}
.card-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--ink);
  letter-spacing:-.01em;
}
.card-title .actions{display:flex;gap:6px}

/* 仪表盘统计卡 */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:24px;
}
.stat-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--line-2);
  transition:all .2s;
}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.stat-card .stat-icon{
  position:absolute;
  top:18px;right:18px;
  width:36px;height:36px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.stat-card.income .stat-icon{background:var(--green-bg);color:var(--green)}
.stat-card.expense .stat-icon{background:var(--red-bg);color:var(--red)}
.stat-card.balance .stat-icon{background:var(--blue-bg);color:var(--blue)}
.stat-card.budget .stat-icon{background:var(--orange-bg);color:var(--orange)}
.stat-label{font-size:12px;color:var(--ink-3);margin-bottom:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-value.expense{color:var(--red)}
.stat-value.income{color:var(--green)}
.stat-value.balance{color:var(--blue)}
.stat-value.budget-warn{color:var(--red)}
.stat-sub{font-size:12px;color:var(--ink-3);margin-top:6px;font-weight:500}

/* 进度条 */
.progress{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--mint),var(--mint-light));border-radius:4px;transition:width .4s ease}
.progress-bar.warn{background:linear-gradient(90deg,var(--yellow),#FBBF24)}
.progress-bar.danger{background:linear-gradient(90deg,var(--red),#F87171)}

/* ============ 表单 ============ */
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.form-field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
.form-field label{font-size:12px;color:var(--ink-3);font-weight:600}
.form-field input,.form-field select,.form-field textarea{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:#fff;
  width:100%;
  transition:all .15s;
}
.form-field input:hover,.form-field select:hover{border-color:var(--ink-4)}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.form-field textarea{resize:vertical;min-height:60px}

/* ============ 表格 ============ */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--line-2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 14px;text-align:left;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
th:first-child{border-top-left-radius:var(--radius-sm)}
th:last-child{border-top-right-radius:var(--radius-sm)}
td{padding:13px 14px;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--mint-50)}
td.amount{font-weight:700;font-variant-numeric:tabular-nums}
td.amount.expense{color:var(--red)}
td.amount.income{color:var(--green)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700}
.tag.expense{background:var(--red-bg);color:var(--red)}
.tag.income{background:var(--green-bg);color:var(--green)}
.tag.neutral{background:var(--bg-2);color:var(--ink-3)}

/* 筛选栏 */
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:16px;
  padding:16px;
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--line-2);
}
.toolbar .form-field{min-width:auto;flex:0 0 auto}
.toolbar .form-field input,.toolbar .form-field select{padding:8px 11px;font-size:13px}
.summary-row{
  display:flex;gap:28px;
  padding:16px 22px;
  background:linear-gradient(135deg,var(--mint-50),var(--blue-bg));
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  margin-top:16px;
  font-size:13px;
  flex-wrap:wrap;
}
.summary-row .item{display:flex;flex-direction:column}
.summary-row .item .label{color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.summary-row .item .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ============ Modal ============ */
.modal-mask{
  position:fixed;inset:0;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}
.modal-mask.show{display:flex}
.modal{
  background:#fff;
  border-radius:var(--radius);
  padding:28px;
  width:100%;
  max-width:540px;
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 24px 64px rgba(15,23,42,.25);
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{font-size:18px;margin-bottom:20px;font-weight:800;letter-spacing:-.02em}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

/* ============ 短期计划 ============ */
.plan-scope-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.scope-tab{
  padding:9px 18px;
  border-radius:var(--radius-sm);
  background:#fff;
  box-shadow:var(--shadow);
  color:var(--ink-2);
  font-size:13px;
  font-weight:600;
  border:1px solid var(--line-2);
  transition:all .15s;
}
.scope-tab:hover{background:var(--bg-2)}
.scope-tab.active{background:var(--mint);color:#fff;border-color:var(--mint);box-shadow:0 2px 8px rgba(16,185,129,.3)}
.plan-panel{margin-bottom:20px}
.plan-progress-bar{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
  font-size:13px;
  color:var(--ink-2);
  font-weight:600;
}
.plan-progress-bar .progress{flex:1;max-width:240px}
.plan-task{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  border-radius:var(--radius-sm);
  background:var(--bg);
  margin-bottom:8px;
  transition:all .15s;
  border:1px solid transparent;
}
.plan-task:hover{background:var(--mint-50);border-color:var(--line)}
.plan-task input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint);cursor:pointer;flex-shrink:0;border-radius:4px}
.plan-task .text{flex:1;font-size:14px}
.plan-task.done .text{text-decoration:line-through;color:var(--ink-4)}
.plan-task .amount-tag{font-size:12px;color:var(--blue);background:var(--blue-bg);padding:3px 9px;border-radius:6px;font-weight:700}
.plan-task .del{opacity:0;transition:opacity .15s}
.plan-task:hover .del{opacity:1}
.plan-add{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.plan-add input[type=text]{flex:1;min-width:150px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.plan-add input[type=text]:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.plan-add input[type=number]{width:110px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-sm)}

/* ============ 长期目标 ============ */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.goal-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  position:relative;
  transition:all .2s;
  border:1px solid var(--line-2);
  overflow:hidden;
}
.goal-card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:var(--mint);
}
.goal-card.h1::before{background:var(--mint)}
.goal-card.h3::before{background:var(--blue)}
.goal-card.h5::before{background:var(--orange)}
.goal-card.h10::before{background:var(--pink)}
.goal-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.goal-card .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.goal-card .name{font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.horizon-tag{
  font-size:11px;
  font-weight:700;
  padding:4px 11px;
  border-radius:20px;
  white-space:nowrap;
}
.horizon-tag.h1{background:var(--mint-bg);color:var(--mint)}
.horizon-tag.h3{background:var(--blue-bg);color:var(--blue)}
.horizon-tag.h5{background:var(--orange-bg);color:var(--orange)}
.horizon-tag.h10{background:var(--pink-bg);color:var(--pink)}
.goal-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin:12px 0 6px}
.goal-meta .saved{color:var(--mint);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.goal-meta .target{font-weight:600;color:var(--ink-2)}
.goal-eta{
  margin-top:14px;
  padding:12px 14px;
  background:var(--bg);
  border-radius:var(--radius-sm);
  font-size:12px;
  color:var(--ink-2);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  font-weight:500;
}
.goal-actions{display:flex;gap:4px;justify-content:flex-end;margin-top:14px}

/* ============ 预算 ============ */
.budget-hero{
  background:linear-gradient(135deg,var(--mint) 0%,var(--blue) 100%);
  color:#fff;
  border-radius:var(--radius);
  padding:32px;
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
}
.budget-hero::after{
  content:"";
  position:absolute;
  top:-50%;right:-20%;
  width:300px;height:300px;
  background:rgba(255,255,255,.08);
  border-radius:50%;
}
.budget-hero .label{font-size:14px;opacity:.95;font-weight:600}
.budget-hero .amount{font-size:40px;font-weight:800;margin:8px 0;letter-spacing:-.03em}
.budget-hero .sub{font-size:13px;opacity:.95;font-weight:500}
.budget-hero .progress{height:12px;background:rgba(255,255,255,.3);margin-top:16px;border-radius:6px}
.budget-hero .progress-bar{background:#fff;border-radius:6px}
.budget-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.budget-stat{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line-2)}
.budget-stat .label{font-size:11px;color:var(--ink-3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.budget-stat .val{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ============ 图表 ============ */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.chart-grid.full{grid-template-columns:1fr}
.chart-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;border:1px solid var(--line-2)}
.chart-box h3{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.01em}
.chart-box canvas{max-height:280px}
.chart-controls{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}

/* ============ 每日分析 ============ */
.daily-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.daily-stat{
  background:#fff;border-radius:var(--radius-md);padding:16px 18px;
  box-shadow:var(--shadow);border:1px solid var(--line-2);
  display:flex;flex-direction:column;gap:6px;
}
.daily-stat .label{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.daily-stat .val{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.daily-stat .sub{font-size:11px;color:var(--ink-4)}
.day-list{display:flex;flex-direction:column;gap:8px}
.day-row{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;background:#fff;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);transition:all .15s;
}
.day-row:hover{box-shadow:var(--shadow-md)}
.day-row .date{font-weight:700;font-size:13px;min-width:90px;color:var(--ink)}
.day-row .date .weekday{font-size:11px;color:var(--ink-4);font-weight:500;margin-top:2px}
.day-row .bars{flex:1;display:flex;flex-direction:column;gap:4px}
.day-row .bar-wrap{display:flex;align-items:center;gap:8px;font-size:12px}
.day-row .bar-wrap .bar-label{width:40px;color:var(--ink-3);font-weight:600}
.day-row .bar-wrap .bar-track{flex:1;height:7px;background:var(--bg-2);border-radius:4px;overflow:hidden}
.day-row .bar-wrap .bar-fill{height:100%;border-radius:4px;transition:width .4s}
.day-row .bar-wrap .bar-fill.income{background:linear-gradient(90deg,var(--green),#34D399)}
.day-row .bar-wrap .bar-fill.expense{background:linear-gradient(90deg,var(--red),#F87171)}
.day-row .bar-wrap .bar-val{min-width:80px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.day-row .bar-wrap .bar-val.income{color:var(--green)}
.day-row .bar-wrap .bar-val.expense{color:var(--red)}
.day-row .net{min-width:90px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.day-row.peak{border-color:var(--orange);background:var(--orange-bg)}
.insight-card{
  background:linear-gradient(135deg,var(--blue-bg),var(--mint-50));
  border:1px solid var(--line);
  border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;
  display:flex;align-items:flex-start;gap:12px;
}
.insight-card .ico{font-size:22px;flex-shrink:0}
.insight-card .text{font-size:13px;color:var(--ink-2);line-height:1.7}
.insight-card .text strong{color:var(--ink)}

/* ============ 空状态 ============ */
.empty{
  text-align:center;
  padding:56px 20px;
  color:var(--ink-3);
}
.empty .emoji{font-size:44px;margin-bottom:12px;opacity:.6}
.empty .text{font-size:14px;font-weight:500}
.empty .text a{font-weight:600}

/* ============ Toast ============ */
.toast{
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);
  color:#fff;
  padding:11px 24px;
  border-radius:24px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  transition:all .3s;
  z-index:200;
  pointer-events:none;
  box-shadow:0 8px 24px rgba(15,23,42,.25);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 响应式 ============ */
@media(max-width:768px){
  .main{padding:16px 14px 96px}
  .chart-grid{grid-template-columns:1fr}
  .topbar{padding:12px 14px}
  .topbar h1{font-size:17px}
  .stat-value{font-size:22px}
  .budget-hero .amount{font-size:28px}
  .budget-hero{padding:22px}
  .goal-grid{grid-template-columns:1fr}
  .toolbar{padding:12px;gap:8px}
  .day-row{flex-wrap:wrap}
  .day-row .bars{order:3;width:100%}
  .daily-grid{grid-template-columns:repeat(2,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .summary-row{gap:18px;padding:14px 16px}
  .summary-row .item .val{font-size:16px}
  .nav-item .label{font-size:9px}
  .nav-item .icon{font-size:19px;width:30px;height:30px}
  .card{padding:16px}
  .chart-box{padding:16px}
  .modal{padding:20px}
  .topbar-actions .btn-sm{padding:5px 9px;font-size:11px}
}
@media(max-width:380px){
  .daily-grid{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .nav-item .label{display:none}
  .nav-item .icon{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="app-icon">🌿</div>
      <div style="min-width:0">
        <h1 id="page-title">仪表盘</h1>
        <div class="subtitle" id="page-subtitle">概览你的财务状况</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="month-switch">
        <button onclick="shiftMonth(-1)" aria-label="上个月">‹</button>
        <span class="label" id="current-month-label"></span>
        <button onclick="shiftMonth(1)" aria-label="下个月">›</button>
      </div>
      <button class="btn btn-sm" onclick="exportData()" title="导出数据">⬇</button>
      <label class="btn btn-sm" style="cursor:pointer" title="导入数据">⬆<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main">
    <div id="view"></div>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" data-route="dashboard"><span class="icon">📊</span><span class="label">仪表盘</span></button>
    <button class="nav-item" data-route="transactions"><span class="icon">💰</span><span class="label">记账</span></button>
    <button class="nav-item" data-route="daily"><span class="icon">📅</span><span class="label">每日</span></button>
    <button class="nav-item" data-route="budget"><span class="icon">⚠️</span><span class="label">预算</span></button>
    <button class="nav-item" data-route="charts"><span class="icon">📈</span><span class="label">图表</span></button>
    <button class="nav-item" data-route="short-plans"><span class="icon">📝</span><span class="label">计划</span></button>
    <button class="nav-item" data-route="goals"><span class="icon">🎯</span><span class="label">目标</span></button>
  </nav>
</div>

<!-- Modal 容器 -->
<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ========================================================
   数据层
======================================================== */
const STORAGE_KEY = 'ledger_data';
const CATEGORIES = ['餐饮','交通','购物','住房','娱乐','医疗','教育','工资','理财收益','其他'];

function defaultData(){
  return {
    version:1,
    settings:{ monthlyBudget:5000, warningThreshold:0.8, currency:'¥' },
    transactions:[],
    shortPlans:[],
    goals:[],
    budgetOverrides:{}
  };
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const data = JSON.parse(raw);
    // 补全字段
    const def = defaultData();
    data.settings = Object.assign({}, def.settings, data.settings||{});
    data.transactions = data.transactions||[];
    data.shortPlans = data.shortPlans||[];
    data.goals = data.goals||[];
    data.budgetOverrides = data.budgetOverrides||{};
    return data;
  }catch(e){
    console.error('loadData error',e);
    return defaultData();
  }
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ toast('保存失败：'+e.message); }
}
let DB = loadData();

/* ========================================================
   工具函数
======================================================== */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return (DB.settings.currency||'¥') + Math.abs(Number(n||0)).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtSigned(n){ const v=Number(n||0); return (v<0?'−':'+')+(DB.settings.currency||'¥')+Math.abs(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function todayStr(){ return fmtDate(new Date()); }
function currentMonthStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthLabel(m){ const [y,mm]=m.split('-'); return `${y}年${parseInt(mm)}月`; }
function shortMonthLabel(m){ const [y,mm]=m.split('-'); return `${parseInt(mm)}月`; }
function shiftMonthStr(m, delta){
  let [y,mm]=m.split('-').map(Number);
  mm+=delta;
  if(mm<1){mm=12;y--}
  if(mm>12){mm=1;y++}
  return `${y}-${String(mm).padStart(2,'0')}`;
}
function getWeekKey(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate()+4-(date.getDay()||7));
  const yearStart = new Date(date.getFullYear(),0,1);
  const weekNum = Math.ceil((((date-yearStart)/86400000)+1)/7);
  return `${date.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;
}
function monthsBetween(start, end){
  const s=new Date(start), e=new Date(end);
  return (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth());
}
function addMonths(date, n){
  const d=new Date(date);
  d.setMonth(d.getMonth()+n);
  return d;
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2200);
}
function confirmDialog(msg, onOk){
  const mask=document.getElementById('modal-mask');
  const modal=document.getElementById('modal');
  modal.innerHTML=`
    <h3>确认操作</h3>
    <p style="margin-bottom:8px;color:var(--ink-2)">${msg}</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="confirm-ok-btn">确定</button>
    </div>`;
  mask.classList.add('show');
  document.getElementById('confirm-ok-btn').onclick=()=>{ closeModal(); onOk(); };
}
function closeModal(){ document.getElementById('modal-mask').classList.remove('show'); }
document.getElementById('modal-mask').addEventListener('click',e=>{ if(e.target.id==='modal-mask') closeModal(); });

/* ========================================================
   聚合查询
======================================================== */
function getMonthExpense(monthStr){
  return DB.transactions.filter(t=>t.type==='expense' && t.date.startsWith(monthStr)).reduce((s,t)=>s+Number(t.amount),0);
}
function getMonthIncome(monthStr){
  return DB.transactions.filter(t=>t.type==='income' && t.date.startsWith(monthStr)).reduce((s,t)=>s+Number(t.amount),0);
}
function getBudget(monthStr){
  return DB.budgetOverrides[monthStr] ?? DB.settings.monthlyBudget;
}
function getCategoryExpense(monthStr){
  const map={};
  DB.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(monthStr)).forEach(t=>{
    map[t.category]=(map[t.category]||0)+Number(t.amount);
  });
  return map;
}
function getGoalSaved(goal){
  // 已存 = 手动调整 + 关联此目标的收入流水累计（不重复计算月存×月数）
  // 月存仅用于 ETA 预估，避免与实际流水叠加导致重复
  let saved = Number(goal.adjustment||0);
  DB.transactions.filter(t=>t.goalId===goal.id && t.type==='income').forEach(t=>{ saved+=Number(t.amount); });
  return saved;
}
function getGoalExpectedSaved(goal){
  // 预期已存（按月存×月数推算，用于对比"应存"进度）
  const months = Math.max(0, monthsBetween(goal.startDate, new Date()));
  return Number(goal.adjustment||0) + goal.monthlySaving*months;
}
function getGoalProgress(goal){
  const saved=getGoalSaved(goal);
  if(goal.targetAmount<=0) return 0;
  return Math.min(100, saved/goal.targetAmount*100);
}
function getGoalETA(goal){
  if(goal.monthlySaving<=0){
    // 没设月存，按最近3个月平均关联收入推算
    const related=DB.transactions.filter(t=>t.goalId===goal.id && t.type==='income');
    if(related.length===0) return null;
    const saved=getGoalSaved(goal);
    const remain=goal.targetAmount-saved;
    if(remain<=0) return '已达成';
    // 按最近3个月平均
    const recent=related.filter(t=>{
      const d=new Date(t.date); const diff=(Date.now()-d.getTime())/86400000;
      return diff<=90;
    });
    const avg = recent.length>0 ? recent.reduce((s,t)=>s+Number(t.amount),0)/3 : 0;
    if(avg<=0) return null;
    const months=Math.ceil(remain/avg);
    return fmtDate(addMonths(new Date(), months));
  }
  const saved=getGoalSaved(goal);
  const remain=goal.targetAmount-saved;
  if(remain<=0) return '已达成';
  const months=Math.ceil(remain/goal.monthlySaving);
  return fmtDate(addMonths(new Date(), months));
}

/* ========================================================
   状态：当前月份
======================================================== */
let currentMonth = currentMonthStr();
function shiftMonth(delta){ currentMonth=shiftMonthStr(currentMonth,delta); render(); }

/* ========================================================
   路由
======================================================== */
const ROUTES = {
  'dashboard':{ title:'仪表盘', sub:'概览你的财务状况', render:renderDashboard },
  'transactions':{ title:'账单流水', sub:'记录每一笔收支', render:renderTransactions },
  'daily':{ title:'每日分析', sub:'按天拆解收支，洞察消费节奏', render:renderDaily },
  'short-plans':{ title:'短期计划', sub:'日 / 周 / 月 计划与任务', render:renderShortPlans },
  'goals':{ title:'长期目标', sub:'1 / 3 / 5 / 10 年存钱目标', render:renderGoals },
  'budget':{ title:'预算预警', sub:'控制支出，守住结余', render:renderBudget },
  'charts':{ title:'图表分析', sub:'可视化你的财务数据', render:renderCharts },
};
let currentRoute = 'dashboard';
let chartInstances = {};

function navigate(route){
  currentRoute = route;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.route===route));
  const r = ROUTES[route];
  document.getElementById('page-title').textContent=r.title;
  document.getElementById('page-subtitle').textContent=r.sub;
  // 销毁旧图表
  Object.values(chartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  chartInstances={};
  render();
  // 滚动到顶部
  document.querySelector('.main')?.scrollTo?.({top:0,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  document.getElementById('current-month-label').textContent=monthLabel(currentMonth);
  ROUTES[currentRoute].render();
}
document.querySelectorAll('.nav-item').forEach(b=>{
  b.addEventListener('click',()=>navigate(b.dataset.route));
});
window.addEventListener('hashchange',()=>{
  const route = location.hash.slice(1) || 'dashboard';
  if(ROUTES[route]) navigate(route);
});

/* ========================================================
   1. 仪表盘
======================================================== */
function renderDashboard(){
  const income=getMonthIncome(currentMonth);
  const expense=getMonthExpense(currentMonth);
  const balance=income-expense;
  const budget=getBudget(currentMonth);
  const budgetRemain=budget-expense;
  const goals=DB.goals.slice(0,3);

  document.getElementById('view').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card income">
        <div class="stat-icon">📈</div>
        <div class="stat-label">本月收入</div>
        <div class="stat-value income">${fmt(income)}</div>
      </div>
      <div class="stat-card expense">
        <div class="stat-icon">📉</div>
        <div class="stat-label">本月支出</div>
        <div class="stat-value expense">${fmt(expense)}</div>
      </div>
      <div class="stat-card balance">
        <div class="stat-icon">💰</div>
        <div class="stat-label">本月结余</div>
        <div class="stat-value balance">${fmt(balance)}</div>
      </div>
      <div class="stat-card budget">
        <div class="stat-icon">⚠️</div>
        <div class="stat-label">预算剩余</div>
        <div class="stat-value ${budgetRemain<0?'budget-warn':''}">${fmt(budgetRemain)}</div>
        <div class="stat-sub">预算 ${fmt(budget)} · 已用 ${budget>0?(expense/budget*100).toFixed(0):0}%</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px" class="dash-charts-wrap">
      <div class="chart-box">
        <h3>近 6 个月收支趋势</h3>
        <canvas id="dash-trend" style="max-height:240px"></canvas>
      </div>
      <div class="chart-box">
        <h3>本月支出分类</h3>
        <canvas id="dash-pie" style="max-height:240px"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎯 长期目标进度 ${goals.length?`<button class="btn btn-sm" onclick="navigate('goals')">查看全部</button>`:''}</div>
      ${goals.length?goals.map(g=>{
        const saved=getGoalSaved(g), expected=getGoalExpectedSaved(g), prog=getGoalProgress(g), eta=getGoalETA(g);
        const diff = saved - expected;
        return `<div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
            <span><strong>${g.name}</strong> <span class="horizon-tag h${g.horizon}" style="font-size:10px">${g.horizon}年</span></span>
            <span style="color:var(--ink-3)">${fmt(saved)} / ${fmt(g.targetAmount)} · ${prog.toFixed(1)}%</span>
          </div>
          <div class="progress"><div class="progress-bar ${prog>=100?'':'warn'}" style="width:${Math.min(prog,100)}%"></div></div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;justify-content:space-between">
            <span>预计达成：${eta||'未设定'}</span>
            ${expected>0?`<span style="color:${diff>=0?'var(--green)':'var(--orange)'}">${diff>=0?'超前':'落后'} ${fmt(Math.abs(diff))}</span>`:''}
          </div>
        </div>`;
      }).join(''):`<div class="empty"><div class="emoji">🎯</div><div class="text">还没有长期目标，<a href="#" onclick="navigate('goals');return false">去创建一个</a></div></div>`}
    </div>
  `;

  // 趋势图
  const months=[]; const incomes=[]; const expenses=[];
  for(let i=5;i>=0;i--){
    const m=shiftMonthStr(currentMonth,-i);
    months.push(shortMonthLabel(m));
    incomes.push(getMonthIncome(m));
    expenses.push(getMonthExpense(m));
  }
  const tc=document.getElementById('dash-trend');
  if(tc){
    chartInstances.dashTrend=new Chart(tc,{
      type:'line',
      data:{ labels:months, datasets:[
        {label:'收入',data:incomes,borderColor:'#52C41A',backgroundColor:'rgba(82,196,26,.1)',fill:true,tension:.3},
        {label:'支出',data:expenses,borderColor:'#FF6B6B',backgroundColor:'rgba(255,107,107,.1)',fill:true,tension:.3}
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}} }
    });
  }
  // 饼图
  const catMap=getCategoryExpense(currentMonth);
  const pc=document.getElementById('dash-pie');
  if(pc){
    const labels=Object.keys(catMap), data=Object.values(catMap);
    if(labels.length){
      chartInstances.dashPie=new Chart(pc,{
        type:'doughnut',
        data:{ labels, datasets:[{ data, backgroundColor:['#4ECDC4','#5B8DEF','#FAAD14','#FF6B6B','#52C41A','#9254DE','#36CFC9','#F759AB','#FFA940','#13C2C2'] }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}} }
      });
    }else{
      pc.parentElement.innerHTML='<div class="empty"><div class="emoji">🍰</div><div class="text">本月暂无支出数据</div></div>';
    }
  }
}

/* ========================================================
   2. 账单流水
======================================================== */
let txFilters = { from:'', to:'', type:'all', category:'all', keyword:'', min:'', max:'' };
function renderTransactions(){
  document.getElementById('view').innerHTML=`
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">➕ 记一笔</div>
      <form id="tx-form" onsubmit="addTransaction(event)">
        <div class="form-row">
          <div class="form-field" style="flex:0 0 140px">
            <label>日期</label>
            <input type="date" id="tx-date" value="${todayStr()}" required>
          </div>
          <div class="form-field" style="flex:0 0 120px">
            <label>类型</label>
            <select id="tx-type" onchange="toggleTxCategory()">
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
          </div>
          <div class="form-field" style="flex:0 0 120px">
            <label>金额</label>
            <input type="number" id="tx-amount" step="0.01" placeholder="0.00（可负数）" required>
          </div>
          <div class="form-field" style="flex:0 0 130px">
            <label>分类</label>
            <select id="tx-category"></select>
          </div>
          <div class="form-field" style="flex:1;min-width:160px">
            <label>备注</label>
            <input type="text" id="tx-note" placeholder="选填">
          </div>
          <div class="form-field" style="flex:0 0 160px">
            <label>关联目标</label>
            <select id="tx-goal" onchange="updateGoalHint()"><option value="">无</option>${DB.goals.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select>
          </div>
          <button type="submit" class="btn btn-primary">添加</button>
        </div>
        <div id="goal-hint" style="font-size:12px;color:var(--mint);margin-top:8px;display:none;font-weight:600"></div>
      </form>
    </div>

    <div class="toolbar">
      <div class="form-field"><label>从</label><input type="date" id="f-from" value="${txFilters.from}" onchange="txFilters.from=this.value;renderTransactions()"></div>
      <div class="form-field"><label>到</label><input type="date" id="f-to" value="${txFilters.to}" onchange="txFilters.to=this.value;renderTransactions()"></div>

      </select></div>
      <div class="form-field"><label>分类</label><select onchange="txFilters.category=this.value;renderTransactions()">
        <option value="all" ${txFilters.category==='all'?'selected':''}>全部</option>
        ${CATEGORIES.map(c=>`<option value="${c}" ${txFilters.category===c?'selected':''}>${c}</option>`).join('')}
      </select></div>
      <div class="form-field"><label>关键词</label><input type="text" placeholder="搜索备注" value="${txFilters.keyword}" onchange="txFilters.keyword=this.value;renderTransactions()"></div>

      <div class="form-field"><label>最大金额</label><input type="number" placeholder="∞" value="${txFilters.max}" onchange="txFilters.max=this.value;renderTransactions()"></div>
      <button class="btn btn-sm" onclick="txFilters={from:'',to:'',type:'all',category:'all',keyword:'',min:'',max:''};renderTransactions()">重置</button>

    <div class="card">
      <div class="card-title">📋 流水明细 <span class="actions"><button class="btn btn-sm btn-danger" onclick="clearAllTx()">清空全部</button></span></div>
      <div id="tx-list"></div>
    </div>
  `;
  toggleTxCategory();
  renderTxList();
}
function toggleTxCategory(){
  const type=document.getElementById('tx-type').value;
  const sel=document.getElementById('tx-category');
  if(!sel) return;
  const cats = type==='income' ? ['工资','理财收益','其他'] : CATEGORIES;
  sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  updateGoalHint();
}
function updateGoalHint(){
  const sel=document.getElementById('tx-goal');
  const hint=document.getElementById('goal-hint');
  const type=document.getElementById('tx-type');
  if(!sel||!hint) return;
  const goalId=sel.value;
  if(!goalId){ hint.style.display='none'; return; }
  const g=DB.goals.find(x=>x.id===goalId);
  if(!g){ hint.style.display='none'; return; }
  if(type && type.value==='expense'){
    hint.style.display='block';
    hint.style.color='var(--ink-3)';
    hint.textContent=`📌 支出不会计入「${g.name}」的已存金额（仅收入类流水会计入）`;
  }else{
    hint.style.display='block';
    hint.style.color='var(--mint)';
    hint.textContent=`📌 此笔收入将计入「${g.name}」的已存金额（当前已存 ${fmt(getGoalSaved(g))}）`;
  }
}
function getFilteredTx(){
  return DB.transactions.filter(t=>{
    if(txFilters.from && t.date<txFilters.from) return false;
    if(txFilters.to && t.date>txFilters.to) return false;
    if(txFilters.type!=='all' && t.type!==txFilters.type) return false;
    if(txFilters.category!=='all' && t.category!==txFilters.category) return false;
    if(txFilters.keyword && !(t.note||'').toLowerCase().includes(txFilters.keyword.toLowerCase())) return false;
    if(txFilters.min && Number(t.amount)<Number(txFilters.min)) return false;
    if(txFilters.max && Number(t.amount)>Number(txFilters.max)) return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
}
function renderTxList(){

    </table></div>
    <div class="summary-row">

      <div class="item"><span class="label">总支出</span><span class="val" style="color:var(--red)">${fmt(totalOut)}</span></div>
      <div class="item"><span class="label">净额</span><span class="val" style="color:${totalIn-totalOut>=0?'var(--green)':'var(--red)'}">${fmt(totalIn-totalOut)}</span></div>
      <div class="item"><span class="label">记录数</span><span class="val">${list.length}</span></div>
    </div>
  `;

function addTransaction(e){
  e.preventDefault();
  let amount=Number(document.getElementById('tx-amount').value);
  let type=document.getElementById('tx-type').value;
  // 允许负数：负数金额按支出处理（如理财亏损），正数按所选类型
  if(amount<0){ type='expense'; amount=Math.abs(amount); }
  if(amount===0){ toast('金额不能为 0'); return; }
  const tx={
    id:uid('ts'),
    date:document.getElementById('tx-date').value,
    type,
    amount,
    category:document.getElementById('tx-category').value,
    note:document.getElementById('tx-note').value.trim(),
    goalId:document.getElementById('tx-goal').value||null,
    createdAt:Date.now()
  };
  DB.transactions.push(tx);
  saveData();
  document.getElementById('tx-amount').value='';
  document.getElementById('tx-note').value='';
  renderTxList();
  if(tx.goalId && tx.type==='income'){
    const g=DB.goals.find(x=>x.id===tx.goalId);
    if(g) toast(`已计入「${g.name}」· 已存 ${fmt(getGoalSaved(g))}`);
    else toast('已添加一笔记录');
  }else{
    toast('已添加一笔记录');
  }
}

function updateEdCats(){

/* ========================================================
   3. 每日分析（按天拆解当月收支）
======================================================== */
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
function getDailyData(monthStr){
  // 按日期聚合当月每天的收支
  const [y,m] = monthStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const map = {}; // date -> {income, expense, count, categories:{}, goalSaving}
  DB.transactions.filter(t=>t.date.startsWith(monthStr)).forEach(t=>{
    if(!map[t.date]) map[t.date] = { date:t.date, income:0, expense:0, count:0, cats:{}, goalSaving:0 };
    const d = map[t.date];
    d.count++;
    if(t.type==='income'){
      d.income += Number(t.amount);
      if(t.goalId) d.goalSaving += Number(t.amount);
    } else {
      d.expense += Number(t.amount);
      d.cats[t.category] = (d.cats[t.category]||0) + Number(t.amount);
    }
  });
  return Object.values(map).sort((a,b)=>b.date.localeCompare(a.date));
}
function renderDaily(){
  const dailyData = getDailyData(currentMonth);
  const totalIn = dailyData.reduce((s,d)=>s+d.income,0);
  const totalOut = dailyData.reduce((s,d)=>s+d.expense,0);
  const totalGoalSaving = dailyData.reduce((s,d)=>s+d.goalSaving,0);
  const activeDays = dailyData.filter(d=>d.count>0).length;
  const [y,m] = currentMonth.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = new Date();
  const isCurrentMonth = currentMonth === currentMonthStr();
  const dayOfMonth = isCurrentMonth ? today.getDate() : daysInMonth;
  const avgDaily = dayOfMonth>0 ? totalOut/dayOfMonth : 0;
  const maxExpenseDay = dailyData.reduce((max,d)=> d.expense>max.expense ? d : max, {expense:0,date:''});
  // 消费最多分类
  const allCats = {};
  dailyData.forEach(d=>{ Object.entries(d.cats).forEach(([k,v])=>{ allCats[k]=(allCats[k]||0)+v; }); });
  const topCat = Object.entries(allCats).sort((a,b)=>b[1]-a[1])[0];
  // 每日最大值（用于条形图归一化）
  const maxBar = Math.max(1, ...dailyData.map(d=>Math.max(d.income,d.expense)));
  // 储蓄率
  const savingRate = totalIn>0 ? ((totalIn-totalOut)/totalIn*100) : 0;

  // 生成洞察
  const insights = [];
  if(maxExpenseDay.date){
    const wd = WEEKDAYS[new Date(maxExpenseDay.date).getDay()];
    insights.push(`消费最高的一天是 <strong>${maxExpenseDay.date}（${wd}）</strong>，支出 <strong>${fmt(maxExpenseDay.expense)}</strong>，占月度总支出的 ${(maxExpenseDay.expense/(totalOut||1)*100).toFixed(1)}%。`);
  }
  if(topCat){
    insights.push(`本月最大支出分类为 <strong>${topCat[0]}</strong>，累计 <strong>${fmt(topCat[1])}</strong>，占比 ${(topCat[1]/(totalOut||1)*100).toFixed(1)}%。`);
  }
  if(activeDays>0){
    const perActiveDay = totalOut/activeDays;
    insights.push(`有记录的 <strong>${activeDays}</strong> 天里，日均支出 <strong>${fmt(perActiveDay)}</strong>；按自然日算日均 <strong>${fmt(avgDaily)}</strong>。`);
  }
  if(totalIn>0 && totalOut>0){
    const ratio = (totalOut/totalIn*100).toFixed(0);
    insights.push(`本月支出占收入的 <strong>${ratio}%</strong>，${ratio>100?'<span style="color:var(--red);font-weight:700">支出已超过收入，建议控制</span>':ratio>80?'<span style="color:var(--orange);font-weight:700">支出偏高，注意节流</span>':'<span style="color:var(--green);font-weight:700">储蓄率健康，继续保持</span>'}。`);
  }
  if(totalGoalSaving>0){
    insights.push(`本月已向长期目标存入 <strong>${fmt(totalGoalSaving)}</strong>，${savingRate>=20?'存钱节奏不错':'建议提高储蓄比例'}。`);
  }

  document.getElementById('view').innerHTML = `
    <div class="daily-grid">
      <div class="daily-stat">
        <div class="label">📅 本月有记录天数</div>
        <div class="val">${activeDays} <span style="font-size:14px;color:var(--ink-3);font-weight:500">/ ${dayOfMonth} 天</span></div>
        <div class="sub">共 ${dailyData.reduce((s,d)=>s+d.count,0)} 笔记录</div>
      </div>
      <div class="daily-stat">
        <div class="label">💸 日均支出（自然日）</div>
        <div class="val" style="color:var(--red)">${fmt(avgDaily)}</div>
        <div class="sub">按 ${dayOfMonth} 天均摊</div>
      </div>
      <div class="daily-stat">
        <div class="label">🔥 单日支出峰值</div>
        <div class="val" style="color:var(--orange)">${fmt(maxExpenseDay.expense||0)}</div>
        <div class="sub">${maxExpenseDay.date||'—'}</div>
      </div>
      <div class="daily-stat">
        <div class="label">🏆 最大支出分类</div>
        <div class="val" style="color:var(--blue)">${topCat?topCat[0]:'—'}</div>
        <div class="sub">${topCat?fmt(topCat[1]):'暂无数据'}</div>
      </div>
      ${totalGoalSaving>0?`<div class="daily-stat">
        <div class="label">🎯 本月目标存入</div>
        <div class="val" style="color:var(--mint)">${fmt(totalGoalSaving)}</div>
        <div class="sub">储蓄率 ${savingRate.toFixed(0)}%</div>
      </div>`:''}
    </div>

    ${insights.length?`<div class="insight-card">
      <div class="ico">💡</div>
      <div class="text">${insights.join('<br>')}</div>
    </div>`:''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px" class="daily-chart-wrap">
      <div class="chart-box">
        <h3>📊 每日收支分布</h3>
        <canvas id="daily-bar" style="max-height:280px"></canvas>
      </div>
      <div class="chart-box">
        <h3>📈 支出累计曲线</h3>
        <canvas id="daily-cum" style="max-height:280px"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📆 每日明细 <span class="actions" style="font-size:12px;color:var(--ink-3);font-weight:500">点击查看当天流水</span></div>
      ${dailyData.length?`<div class="day-list">
        ${dailyData.map(d=>{
          const wd = WEEKDAYS[new Date(d.date).getDay()];
          const isPeak = d.date===maxExpenseDay.date && d.expense>0;
          const net = d.income - d.expense;
          const inPct = (d.income/maxBar*100).toFixed(0);
          const outPct = (d.expense/maxBar*100).toFixed(0);
          const topCatOfDay = Object.entries(d.cats).sort((a,b)=>b[1]-a[1])[0];
          return `<a class="day-row ${isPeak?'peak':''}" href="#transactions" onclick="setTxDateFilter('${d.date}');return false;">
            <div class="date">${d.date.slice(8)}日<div class="weekday">${wd} · ${d.count}笔</div></div>
            <div class="bars">
              <div class="bar-wrap"><span class="bar-label">收入</span><div class="bar-track"><div class="bar-fill income" style="width:${inPct}%"></div></div><span class="bar-val income">${d.income>0?fmt(d.income):'—'}</span></div>
              <div class="bar-wrap"><span class="bar-label">支出</span><div class="bar-track"><div class="bar-fill expense" style="width:${outPct}%"></div></div><span class="bar-val expense">${d.expense>0?fmt(d.expense):'—'}</span></div>
            </div>
            <div class="net" style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${fmt(net)}</div>
          </a>`;
        }).join('')}
      </div>`:`<div class="empty"><div class="emoji">📅</div><div class="text">本月暂无流水记录，<a href="#" onclick="navigate('transactions');return false">去记一笔</a></div></div>`}
    </div>
  `;

  // 每日柱状图
  const bc = document.getElementById('daily-bar');
  if(bc && dailyData.length){
    const sorted = [...dailyData].sort((a,b)=>a.date.localeCompare(b.date));
    chartInstances.dailyBar = new Chart(bc, {
      type:'bar',
      data:{ labels: sorted.map(d=>parseInt(d.date.slice(8))+'日'), datasets:[
        { label:'收入', data: sorted.map(d=>d.income), backgroundColor:'rgba(16,185,129,.8)', borderColor:'#10B981', borderWidth:1, stack:'a' },
        { label:'支出', data: sorted.map(d=>d.expense), backgroundColor:'rgba(239,68,68,.8)', borderColor:'#EF4444', borderWidth:1, stack:'a' }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}, scales:{y:{beginAtZero:true,ticks:{callback:v=>DB.settings.currency+v}}}, x:{ticks:{font:{size:10}}} }
    });
  }else if(bc){
    bc.parentElement.innerHTML='<div class="empty"><div class="emoji">📭</div><div class="text">暂无数据</div></div>';
  }

  // 累计曲线
  const cc = document.getElementById('daily-cum');
  if(cc && dailyData.length){
    const sorted = [...dailyData].sort((a,b)=>a.date.localeCompare(b.date));
    let cum=0; const cumData=sorted.map(d=>{ cum+=d.expense; return cum; });
    chartInstances.dailyCum = new Chart(cc, {
      type:'line',
      data:{ labels: sorted.map(d=>parseInt(d.date.slice(8))+'日'), datasets:[
        { label:'支出累计', data: cumData, borderColor:'#F59E0B', backgroundColor:'rgba(245,158,11,.12)', fill:true, tension:.3, pointRadius:3, pointBackgroundColor:'#F59E0B' }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}, scales:{y:{beginAtZero:true,ticks:{callback:v=>DB.settings.currency+v}}}, x:{ticks:{font:{size:10}}} }
    });
  }else if(cc){
    cc.parentElement.innerHTML='<div class="empty"><div class="emoji">📭</div><div class="text">暂无数据</div></div>';
  }
}
function setTxDateFilter(date){
  txFilters = { from:date, to:date, type:'all', category:'all', keyword:'', min:'', max:'' };
  navigate('transactions');
}

/* ========================================================
   4. 预算预警
======================================================== */
function renderBudget(){
  const expense=getMonthExpense(currentMonth);
  const budget=getBudget(currentMonth);
  const remain=budget-expense;
  const ratio=budget>0?expense/budget*100:0;
  const dayOfMonth=new Date().getDate();
  const daysInMonth=new Date(new Date(currentMonth+'-01').getFullYear(), new Date(currentMonth+'-01').getMonth()+1, 0).getDate();
  const isCurrentMonth = currentMonth===currentMonthStr();
  const daysLeft = isCurrentMonth ? (daysInMonth-dayOfMonth) : 0;
  const dailyAvg = dayOfMonth>0 ? expense/dayOfMonth : 0;
  const suggestDaily = daysLeft>0 ? remain/daysLeft : 0;
  const threshold=DB.settings.warningThreshold||0.8;
  const warnRatio=threshold*100;

  let barClass='', statusText='', statusColor='';
  if(ratio>=100){ barClass='danger'; statusText='已超支！'; statusColor='var(--red)'; }
  else if(ratio>=warnRatio){ barClass='warn'; statusText='接近预算上限'; statusColor='var(--yellow)'; }
  else { barClass=''; statusText='支出健康'; statusColor='var(--green)'; }

  document.getElementById('view').innerHTML=`
    <div class="budget-hero">
      <div class="label">${monthLabel(currentMonth)} 支出 / 预算</div>
      <div class="amount">${fmt(expense)} <span style="font-size:18px;opacity:.8">/ ${fmt(budget)}</span></div>
      <div class="sub">剩余 <strong>${fmt(remain)}</strong> · 已用 ${ratio.toFixed(1)}% · <strong style="color:${statusColor==='#FFF'?'#FFE066':statusColor}">${statusText}</strong></div>
      <div class="progress"><div class="progress-bar ${barClass}" style="width:${Math.min(ratio,100)}%;background:${ratio>=100?'#FF6B6B':ratio>=warnRatio?'#FFD43B':'#fff'}"></div></div>
    </div>

    <div class="budget-stats">
      <div class="budget-stat"><div class="label">预算上限</div><div class="val">${fmt(budget)}</div></div>
      <div class="budget-stat"><div class="label">已支出</div><div class="val" style="color:var(--red)">${fmt(expense)}</div></div>
      <div class="budget-stat"><div class="label">剩余可用</div><div class="val" style="color:${remain<0?'var(--red)':'var(--green)'}">${fmt(remain)}</div></div>
      <div class="budget-stat"><div class="label">日均支出</div><div class="val">${fmt(dailyAvg)}</div></div>
      ${isCurrentMonth?`<div class="budget-stat"><div class="label">距月末</div><div class="val">${daysLeft} 天</div></div>`:''}
      ${isCurrentMonth&&daysLeft>0?`<div class="budget-stat"><div class="label">建议日预算</div><div class="val" style="color:var(--blue)">${fmt(suggestDaily)}</div></div>`:''}
    </div>

    <div class="card">
      <div class="card-title">⚙️ 预算设置</div>
      <div class="form-row">
        <div class="form-field" style="flex:0 0 200px">
          <label>${monthLabel(currentMonth)} 预算</label>
          <input type="number" id="month-budget" value="${budget}" step="100">
        </div>
        <div class="form-field" style="flex:0 0 200px">
          <label>默认月预算</label>
          <input type="number" id="default-budget" value="${DB.settings.monthlyBudget}" step="100">
        </div>
        <div class="form-field" style="flex:0 0 150px">
          <label>预警阈值 (%)</label>
          <input type="number" id="warn-threshold" value="${(DB.settings.warningThreshold*100).toFixed(0)}" min="50" max="100">
        </div>
        <button class="btn btn-primary" onclick="saveBudgetSettings()">保存</button>
      </div>
      <p style="font-size:12px;color:var(--ink-3);margin-top:10px">💡 为当前月份设置的预算会覆盖默认值；预警阈值决定何时显示黄色警告（默认 80%）。</p>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">📋 近 6 个月预算执行情况</div>
      <div class="table-wrap"><table>
        <thead><tr><th>月份</th><th>预算</th><th>支出</th><th>剩余</th><th>执行率</th><th>状态</th></tr></thead>
        <tbody>
          ${(()=>{ const rows=[]; for(let i=5;i>=0;i--){ const m=shiftMonthStr(currentMonth,-i); const b=getBudget(m); const e=getMonthExpense(m); const r=b-e; const rr=b>0?e/b*100:0; let st; if(rr>=100)st='<span style="color:var(--red)">超支</span>'; else if(rr>=warnRatio)st='<span style="color:var(--yellow)">警戒</span>'; else st='<span style="color:var(--green)">健康</span>'; rows.push(`<tr><td>${monthLabel(m)}</td><td>${fmt(b)}</td><td style="color:var(--red)">${fmt(e)}</td><td style="color:${r<0?'var(--red)':'var(--green)'}">${fmt(r)}</td><td>${rr.toFixed(1)}%</td><td>${st}</td></tr>`); } return rows.join(''); })()}
        </tbody>
      </table></div>
    </div>
  `;
}
function saveBudgetSettings(){
  const mb=Number(document.getElementById('month-budget').value);
  const db=Number(document.getElementById('default-budget').value);
  const wt=Number(document.getElementById('warn-threshold').value)/100;
  DB.budgetOverrides[currentMonth]=mb;
  DB.settings.monthlyBudget=db;
  DB.settings.warningThreshold=wt;
  saveData();
  render();
  toast('预算设置已保存');
}

/* ========================================================
   4. 短期计划
======================================================== */
let planScope = 'day';
let planDate = new Date(); // 用于日/周/月定位
function renderShortPlans(){
  const periodKey = planScope==='day'?fmtDate(planDate)
    : planScope==='week'?getWeekKey(planDate)
    : `${planDate.getFullYear()}-${String(planDate.getMonth()+1).padStart(2,'0')}`;

  const periodLabel = planScope==='day'?fmtDate(planDate)
    : planScope==='week'?`第 ${periodKey.split('W')[1]} 周`
    : monthLabel(periodKey);

  document.getElementById('view').innerHTML=`
    <div class="plan-scope-tabs">
      ${['day','week','month'].map(s=>`<button class="scope-tab ${planScope===s?'active':''}" onclick="switchScope('${s}')">${s==='day'?'日计划':s==='week'?'周计划':'月计划'}</button>`).join('')}
    </div>

    <div class="card">
      <div class="card-title">
        <span>📝 ${planScope==='day'?'日':planScope==='week'?'周':'月'}计划 · ${periodLabel}</span>
        <span class="actions">
          <button class="btn btn-sm" onclick="shiftPlanPeriod(-1)">‹ 上一${planScope==='day'?'天':planScope==='week'?'周':'月'}</button>
          <button class="btn btn-sm" onclick="shiftPlanPeriod(0)">今天</button>
          <button class="btn btn-sm" onclick="shiftPlanPeriod(1)">下一${planScope==='day'?'天':planScope==='week'?'周':'月'} ›</button>
        </span>
      </div>
      <div id="plan-list"></div>
      <div class="plan-add">
        <input type="text" id="plan-text" placeholder="添加计划任务..." onkeydown="if(event.key==='Enter')addPlan()">
        <input type="number" id="plan-amount" placeholder="金额(选填)" step="0.01">
        <button class="btn btn-primary" onclick="addPlan()">添加</button>
      </div>
    </div>
  `;
  renderPlanList();
}
function switchScope(s){ planScope=s; planDate=new Date(); renderShortPlans(); }
function shiftPlanPeriod(delta){
  if(delta===0){ planDate=new Date(); }
  else if(planScope==='day'){ planDate.setDate(planDate.getDate()+delta); }
  else if(planScope==='week'){ planDate.setDate(planDate.getDate()+delta*7); }
  else { planDate.setMonth(planDate.getMonth()+delta); }
  renderShortPlans();
}
function getCurrentPeriodKey(){
  return planScope==='day'?fmtDate(planDate)
    : planScope==='week'?getWeekKey(planDate)
    : `${planDate.getFullYear()}-${String(planDate.getMonth()+1).padStart(2,'0')}`;
}
function renderPlanList(){
  const pk=getCurrentPeriodKey();
  const items=DB.shortPlans.filter(p=>p.scope===planScope && p.periodKey===pk).sort((a,b)=>a.createdAt-b.createdAt);
  const done=items.filter(p=>p.done).length;
  const total=items.length;
  const prog=total>0?(done/total*100):0;
  const el=document.getElementById('plan-list');
  if(!items.length){
    el.innerHTML=`<div class="empty"><div class="emoji">📋</div><div class="text">还没有${planScope==='day'?'日':planScope==='week'?'周':'月'}计划任务</div></div>`;
    return;
  }
  el.innerHTML=`
    <div class="plan-progress-bar">
      <span>完成 ${done} / ${total}</span>
      <div class="progress"><div class="progress-bar" style="width:${prog}%"></div></div>
      <span>${prog.toFixed(0)}%</span>
    </div>
    ${items.map(p=>`
      <div class="plan-task ${p.done?'done':''}">
        <input type="checkbox" ${p.done?'checked':''} onchange="togglePlan('${p.id}')">
        <span class="text">${p.text}</span>
        ${p.amount?`<span class="amount-tag">${fmt(p.amount)}</span>`:''}
        <button class="btn btn-sm btn-danger del" onclick="deletePlan('${p.id}')">删除</button>
      </div>
    `).join('')}
  `;
}
function addPlan(){
  const text=document.getElementById('plan-text').value.trim();
  if(!text){ toast('请输入任务内容'); return; }
  const amount=document.getElementById('plan-amount').value;
  DB.shortPlans.push({
    id:uid('sp'),
    scope:planScope,
    periodKey:getCurrentPeriodKey(),
    text,
    amount: amount?Number(amount):null,
    done:false,
    createdAt:Date.now()
  });
  saveData();
  document.getElementById('plan-text').value='';
  document.getElementById('plan-amount').value='';
  renderPlanList();
  toast('已添加任务');
}
function togglePlan(id){
  const p=DB.shortPlans.find(x=>x.id===id);
  if(!p) return;
  p.done=!p.done;
  saveData();
  renderPlanList();
}
function deletePlan(id){
  DB.shortPlans=DB.shortPlans.filter(p=>p.id!==id);
  saveData();
  renderPlanList();
  toast('已删除');
}

/* ========================================================
   5. 长期目标
======================================================== */
function renderGoals(){
  const goals=DB.goals;
  document.getElementById('view').innerHTML=`
    <div style="margin-bottom:16px">
      <button class="btn btn-primary" onclick="editGoal()">+ 新建存钱目标</button>
      ${goals.length?`<span style="margin-left:12px;color:var(--ink-3);font-size:13px">共 ${goals.length} 个目标</span>`:''}
    </div>
    ${goals.length?`<div class="goal-grid" id="goal-grid"></div>`:`<div class="card"><div class="empty"><div class="emoji">🎯</div><div class="text">还没有长期目标<br><a href="#" onclick="editGoal();return false">创建第一个存钱目标</a></div></div></div>`}
  `;
  if(goals.length) renderGoalGrid();
}
function renderGoalGrid(){
  const grid=document.getElementById('goal-grid');
  grid.innerHTML=DB.goals.map(g=>{
    const saved=getGoalSaved(g);
    const expected=getGoalExpectedSaved(g);
    const prog=getGoalProgress(g);
    const eta=getGoalETA(g);
    const months = Math.max(0, monthsBetween(g.startDate, new Date()));
    const relatedCount = DB.transactions.filter(t=>t.goalId===g.id && t.type==='income').length;
    const diff = saved - expected;
    const diffText = expected>0 ? (diff>=0 ? `超前 ${fmt(diff)}` : `落后 ${fmt(Math.abs(diff))}`) : '';
    return `<div class="goal-card h${g.horizon}">
      <div class="header">
        <div class="name">${g.name}</div>
        <span class="horizon-tag h${g.horizon}">${g.horizon}年目标</span>
      </div>
      <div class="goal-meta">
        <span>已存 <span class="saved">${fmt(saved)}</span></span>
        <span class="target">目标 ${fmt(g.targetAmount)}</span>
      </div>
      <div class="progress"><div class="progress-bar ${prog>=100?'':'warn'}" style="width:${Math.min(prog,100)}%"></div></div>
      <div style="text-align:right;font-size:12px;color:var(--ink-3);margin-top:4px">${prog.toFixed(1)}%</div>
      <div class="goal-eta">
        <span>📅 起始 ${g.startDate}</span>
        <span>💰 月存 ${fmt(g.monthlySaving)}</span>
        <span>⏱ ${eta?('预计 '+eta):'未设定月存'}</span>
        <span>⏳ 已坚持 ${months} 个月</span>
        <span>📝 已记 ${relatedCount} 笔</span>
        ${diffText?`<span style="color:${diff>=0?'var(--green)':'var(--orange)'};font-weight:600">${diffText}</span>`:''}
      </div>
      <div class="goal-actions">
        <button class="btn btn-sm" onclick="editGoal('${g.id}')">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteGoal('${g.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}
function editGoal(id){
  const g = id?DB.goals.find(x=>x.id===id):null;
  const mask=document.getElementById('modal-mask');
  const modal=document.getElementById('modal');
  modal.innerHTML=`
    <h3>${g?'编辑存钱目标':'新建存钱目标'}</h3>
    <div class="form-row">
      <div class="form-field" style="flex:1;min-width:200px"><label>目标名称</label><input type="text" id="g-name" value="${g?g.name:''}" placeholder="如：5年买房基金"></div>
      <div class="form-field" style="flex:0 0 120px"><label>年限</label><select id="g-horizon">
        ${[1,3,5,10].map(h=>`<option value="${h}" ${g&&g.horizon===h?'selected':''}>${h} 年</option>`).join('')}
      </select></div>
    </div>
    <div class="form-row" style="margin-top:12px">
      <div class="form-field"><label>目标金额</label><input type="number" id="g-target" value="${g?g.targetAmount:''}" step="100" placeholder="如：200000"></div>
      <div class="form-field"><label>每月存钱</label><input type="number" id="g-monthly" value="${g?g.monthlySaving:''}" step="100" placeholder="如：3000"></div>
    </div>
    <div class="form-row" style="margin-top:12px">
      <div class="form-field"><label>开始日期</label><input type="date" id="g-start" value="${g?g.startDate:todayStr()}"></div>
      <div class="form-field"><label>已存调整 (手动修正)</label><input type="number" id="g-adjust" value="${g?g.adjustment:0}" step="100" placeholder="如已有存款可填"></div>
    </div>
    <p style="font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.7">💡 <strong>已存金额 = 手动调整 + 关联此目标的收入流水</strong>。<br>在「记账」页记录收入时选择关联本目标，已存金额会自动累加。<br>「月存」仅用于推算预计达成时间，不会重复计入已存。</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveGoal('${id||''}')">保存</button>
    </div>`;
  mask.classList.add('show');
}
function saveGoal(id){
  const name=document.getElementById('g-name').value.trim();
  const target=Number(document.getElementById('g-target').value);
  if(!name){ toast('请输入目标名称'); return; }
  if(target<=0){ toast('请输入有效目标金额'); return; }
  const data={
    name,
    horizon:Number(document.getElementById('g-horizon').value),
    targetAmount:target,
    monthlySaving:Number(document.getElementById('g-monthly').value)||0,
    startDate:document.getElementById('g-start').value,
    adjustment:Number(document.getElementById('g-adjust').value)||0,
  };
  if(id){
    const g=DB.goals.find(x=>x.id===id);
    Object.assign(g,data);
  }else{
    DB.goals.push(Object.assign({ id:uid('g'), createdAt:Date.now() }, data));
  }
  saveData();
  closeModal();
  renderGoals();
  toast(id?'已更新目标':'已创建目标');
}
function deleteGoal(id){
  const g=DB.goals.find(x=>x.id===id);
  confirmDialog(`确定删除目标「${g.name}」吗？`,()=>{
    DB.goals=DB.goals.filter(x=>x.id!==id);
    // 解除关联流水
    DB.transactions.forEach(t=>{ if(t.goalId===id) t.goalId=null; });
    saveData();
    renderGoals();
    toast('已删除');
  });
}

/* ========================================================
   6. 图表分析
======================================================== */
let chartRange = 6;
let chartPieMonth = currentMonthStr();
function renderCharts(){
  document.getElementById('view').innerHTML=`
    <div class="chart-box" style="margin-bottom:16px">
      <h3>📊 收支趋势
        <div class="chart-controls">
          <select onchange="chartRange=Number(this.value);renderCharts()">
            ${[6,12].map(r=>`<option value="${r}" ${chartRange===r?'selected':''}>近 ${r} 个月</option>`).join('')}
          </select>
        </div>
      </h3>
      <canvas id="chart-trend" style="max-height:300px"></canvas>
    </div>

    <div class="chart-grid">
      <div class="chart-box">
        <h3>🥧 支出分类占比
          <select onchange="chartPieMonth=this.value;renderCharts()">
            ${(()=>{ const opts=[]; for(let i=0;i<6;i++){ const m=shiftMonthStr(currentMonth,-i); opts.push(`<option value="${m}" ${chartPieMonth===m?'selected':''}>${monthLabel(m)}</option>`); } return opts.join(''); })()}
          </select>
        </h3>
        <canvas id="chart-pie" style="max-height:260px"></canvas>
      </div>
      <div class="chart-box">
        <h3>🎯 储蓄目标进度</h3>
        <canvas id="chart-goal" style="max-height:260px"></canvas>
      </div>
    </div>

    <div class="chart-box" style="margin-top:16px">
      <h3>💵 月度结余（收入 - 支出）</h3>
      <canvas id="chart-balance" style="max-height:260px"></canvas>
    </div>
  `;

  // 趋势图
  const months=[],incomes=[],expenses=[];
  for(let i=chartRange-1;i>=0;i--){
    const m=shiftMonthStr(currentMonth,-i);
    months.push(shortMonthLabel(m));
    incomes.push(getMonthIncome(m));
    expenses.push(getMonthExpense(m));
  }
  const tc=document.getElementById('chart-trend');
  if(tc) chartInstances.trend=new Chart(tc,{
    type:'bar',
    data:{ labels:months, datasets:[
      {label:'收入',data:incomes,backgroundColor:'rgba(82,196,26,.7)',borderColor:'#52C41A',borderWidth:1},
      {label:'支出',data:expenses,backgroundColor:'rgba(255,107,107,.7)',borderColor:'#FF6B6B',borderWidth:1}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}} }
  });

  // 饼图
  const catMap=getCategoryExpense(chartPieMonth);
  const pc=document.getElementById('chart-pie');
  if(pc){
    const labels=Object.keys(catMap), data=Object.values(catMap);
    if(labels.length){
      chartInstances.pie=new Chart(pc,{
        type:'doughnut',
        data:{ labels, datasets:[{ data, backgroundColor:['#4ECDC4','#5B8DEF','#FAAD14','#FF6B6B','#52C41A','#9254DE','#36CFC9','#F759AB','#FFA940','#13C2C2'] }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}} }
      });
    }else{
      pc.parentElement.innerHTML='<div class="empty" style="padding:30px"><div class="emoji">🍰</div><div class="text">该月暂无支出数据</div></div>';
    }
  }

  // 目标进度
  const gc=document.getElementById('chart-goal');
  if(gc){
    if(DB.goals.length){
      chartInstances.goal=new Chart(gc,{
        type:'bar',
        data:{
          labels:DB.goals.map(g=>g.name),
          datasets:[{ label:'进度 %', data:DB.goals.map(g=>getGoalProgress(g)), backgroundColor:DB.goals.map(g=>{ const p=getGoalProgress(g); return p>=100?'#52C41A':p>=50?'#4ECDC4':'#FAAD14'; }) }]
        },
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true,max:100}} }
      });
    }else{
      gc.parentElement.innerHTML='<div class="empty" style="padding:30px"><div class="emoji">🎯</div><div class="text">暂无目标</div></div>';
    }
  }

  // 月度结余
  const bc=document.getElementById('chart-balance');
  if(bc){
    const bMonths=[], balances=[];
    for(let i=5;i>=0;i--){
      const m=shiftMonthStr(currentMonth,-i);
      bMonths.push(shortMonthLabel(m));
      balances.push(getMonthIncome(m)-getMonthExpense(m));
    }
    chartInstances.balance=new Chart(bc,{
      type:'bar',
      data:{ labels:bMonths, datasets:[{ label:'结余', data:balances, backgroundColor:balances.map(v=>v>=0?'rgba(82,196,26,.7)':'rgba(255,107,107,.7)') }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
    });
  }
}

/* ========================================================
   导出 / 导入
======================================================== */
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`记账数据_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出数据');
}
function importData(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.transactions || !Array.isArray(data.transactions)) throw new Error('格式错误');
      confirmDialog('导入将覆盖当前所有数据，确定继续吗？',()=>{
        DB=Object.assign(defaultData(),data);
        saveData();
        render();
        toast('已导入数据');
      });
    }catch(err){
      toast('导入失败：'+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value='';
}
